name: Trending + Quarterly + ROSS (Sat/Sun 2x daily + manual)

on:
  schedule:
    # Saturday: morning + evening
    - cron: "17 6 * * 6"   # Sat 06:17 UTC = 11:47 AM IST
    - cron: "17 18 * * 6"  # Sat 18:17 UTC = 11:47 PM IST
    # Sunday: morning + evening
    - cron: "17 6 * * 0"   # Sun 06:17 UTC = 11:47 AM IST
    - cron: "17 18 * * 0"  # Sun 18:17 UTC = 11:47 PM IST
  workflow_dispatch:
    inputs:
      year:
        description: "Override year"
        required: false
        default: ""
      quarter:
        description: "Override quarter (Q1..Q4 or 1..4)"
        required: false
        default: ""
      max_run_ms:
        description: "Max run time ms (default 4h50m)"
        required: false
        default: "17400000"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # < 6h hard limit [web:6]
    steps:
      - uses: actions/checkout@v4 # Repo checkout to $GITHUB_WORKSPACE. [web:48]

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install node-fetch@2

      - name: Check existing state
        run: |
          echo "=== Workspace state ==="
          ls -la data/ || mkdir -p data
          ls -la data/state/ || echo "No state dir yet"
          cat data/state/fetch_stars_state.json 2>/dev/null || echo "No state file"

      - name: Compute year/quarter
        id: compute
        shell: bash
        run: |
          # Step outputs should be written to $GITHUB_OUTPUT env file. [web:23]
          Y="${{ inputs.year }}"
          Q="${{ inputs.quarter }}"

          # Normalize quarter input like "Q4" -> "4"
          if [ -n "$Q" ]; then
            Q="${Q#Q}"
          fi

          if [ -z "$Y" ] || [ -z "$Q" ]; then
            node -e '
              const d=new Date();
              const y=d.getUTCFullYear();
              const m=d.getUTCMonth()+1;
              const q=m<=3?1:m<=6?2:m<=9?3:4;
              console.log(`year=${y}`);
              console.log(`quarter_key=${y}-Q${q}`);
            ' >> "$GITHUB_OUTPUT"
          else
            echo "year=$Y" >> "$GITHUB_OUTPUT"
            echo "quarter_key=$Y-Q$Q" >> "$GITHUB_OUTPUT"
          fi

          echo "Computed: year=${{ steps.compute.outputs.year }} quarter_key=${{ steps.compute.outputs.quarter_key }}"

      - name: Scrape trending candidates
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: node scripts/scrape_trending.js

      - name: Build candidates
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KEY="${{ steps.compute.outputs.quarter_key }}"   # e.g. "2025-Q4"
          Y="${{ steps.compute.outputs.year }}"            # e.g. "2025"
          Q="${KEY##*-}"                                   # -> "Q4"
          node scripts/build_candidates.js "$Y" "$Q"

      - name: Fetch stars (resumable + auto-commit)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          MAX_RUN_MS: ${{ inputs.max_run_ms }}
        run: node scripts/fetch_stars.js

      - name: Fetch repo meta
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: node scripts/fetch_repo_meta.js

      - name: Enrich contributor locations
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: node scripts/enrich_contributor_locations.js

      - name: Aggregate + rank quarters
        run: |
          node scripts/aggregate_weekly.js
          Y="${{ steps.compute.outputs.year }}"
          for q in 1 2 3 4; do
            node scripts/rank_quarter.js "$Y" "$q"
            node scripts/rank_ross_quarter.js "$Y" "$q"
          done

      - name: Final commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "final refresh ($(date -u +'%Y-%m-%dT%H:%M:%SZ'))" || echo "no changes"
          git push || echo "no final changes"
